name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: n8n_library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_POSTGRESDB_HOST: localhost
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: postgres
      DB_POSTGRESDB_DATABASE: n8n_library_test
      DB_POSTGRESDB_SCHEMA: public
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      CREDENTIAL_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Syntax check
        run: |
          for f in server.js db.js migrate.js setup.js lib/*.js routes/*.js; do
            node --check "$f"
          done

      - name: Run migrations twice (idempotency)
        run: |
          node migrate.js
          node migrate.js

      - name: Run tests
        run: npm test

      - name: TypeScript build
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint .

      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          cd frontend && npm audit --omit=dev --audit-level=high
